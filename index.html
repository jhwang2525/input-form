<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animated Login Form | Jun Hwang</title>
    <meta name="description" content="Login form with letter-by-letter wave labels, validation and a password toggle." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="promo" aria-hidden="true">
        <div class="promo-inner">
          <span class="logo">◆ Northwind</span>
          <h2>Welcome back.</h2>
          <p>Sign in to manage your orders, track shipments and reorder your favorites.</p>
          <div class="blob one"></div>
          <div class="blob two"></div>
        </div>
      </section>

      <section class="container">
        <h1>Sign in</h1>
        <p class="sub">Use your email and password to continue.</p>

        <form id="login-form" novalidate>
          <div class="form-control">
            <input id="email" type="email" required autocomplete="email" />
            <label for="email">Email</label>
            <p class="error" id="email-error" aria-live="polite"></p>
          </div>

          <div class="form-control">
            <input id="password" type="password" required minlength="8" autocomplete="current-password" />
            <label for="password">Password</label>
            <button type="button" class="toggle" id="toggle-password" aria-label="Show password">Show</button>
            <p class="error" id="password-error" aria-live="polite"></p>
          </div>

          <div class="row">
            <label class="remember"><input type="checkbox" /> Remember me</label>
            <a href="#" class="link">Forgot password?</a>
          </div>

          <button class="btn" type="submit">Sign in</button>
          <p class="success" id="success" role="status" hidden>✓ Signed in. (Demo: nothing is sent anywhere.)</p>

          <p class="text">Don't have an account? <a href="#" class="link">Create one</a></p>
        </form>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
